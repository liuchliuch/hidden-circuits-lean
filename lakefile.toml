name = "hiddenCircuitsOrderedGraphs"
version = "0.1.0"
defaultTargets = ["HiddenCircuits", "Proofs"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "f156f7abd91ac67adb22bf999e5a71ba22e22e41"

[[lean_lib]]
name = "HiddenCircuits"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]

[[lean_lib]]
name = "Proofs"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]

[[lean_lib]]
name = "Statements"
moreLeanArgs = ["-Dbackward.isDefEq.respectTransparency=false"]
